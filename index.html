<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Map Channel Fixer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="layout">
            <aside class="left-pane">
                <header class="header">
                    <h1>Channel<span class="highlight">Fixer</span></h1>
                    <p>法线贴图通道修复工具</p>
                </header>
                <div class="upload-section" id="dropZone">
                    <input type="file" id="fileInput" accept="image/png, image/jpeg, image/tga">
                    <div class="upload-content">
                        <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p>点击选择图片 或 拖拽图片到这里</p>
                        <span class="file-info" id="fileName">未选择文件</span>
                    </div>
                </div>
                <div class="history">
                    <div class="history-header">
                        <h3>历史记录</h3>
                        <button id="clearHistoryBtn" class="btn secondary-btn">清空</button>
                    </div>
                    <div id="historyList" class="history-list"></div>
                </div>
            </aside>

            <section class="center-pane">
                <div class="controls">
                    <button id="fixBtn" class="btn primary-btn" disabled>
                        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                        </svg>
                        开始修复
                    </button>
                    <button id="downloadBtn" class="btn secondary-btn" disabled>
                        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        下载结果
                    </button>
                </div>

                <div class="preview-container">
                    <div class="preview-card">
                        <div class="card-header">
                            <span class="badge original">Original</span>
                            <span class="res-info" id="originalRes"></span>
                        </div>
                        <div class="canvas-wrapper">
                            <canvas id="originalCanvas"></canvas>
                            <div class="empty-state">等待图片导入...</div>
                            <span class="channel-badge" id="originalChannels"></span>
                        </div>
                    </div>

                    <div class="preview-card">
                        <div class="card-header">
                            <span class="badge processed">Fixed</span>
                            <span class="res-info" id="fixedRes"></span>
                        </div>
                        <div class="canvas-wrapper">
                            <canvas id="processedCanvas"></canvas>
                            <div class="empty-state">等待处理...</div>
                            <span class="channel-badge" id="fixedChannels"></span>
                        </div>
                    </div>
                </div>
                <div class="progress">
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-meta">
                        <span class="progress-title">生成进度</span>
                        <span class="progress-label" id="progressLabel">等待处理</span>
                    </div>
                </div>
            </section>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
